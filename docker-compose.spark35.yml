# Spark 3.5 replica of docker-compose.yml (batch 4, step 3): same services,
# resources and limits, Spark 3.5.9 image. Shares the Parquet data volume of
# the 4.1.3 cluster (diploma_spark-data); event logs and local dirs are
# separate (project "spark35"). Only one of the two clusters may run at a time
# (same host ports). Use: docker compose -f docker-compose.spark35.yml ...
# Data, event logs and Spark local (shuffle/spill) dirs live on Docker named
# volumes inside the Docker VM; only the project code is bind-mounted.

name: spark35

x-spark-image: &spark-image apache/spark:3.5.9-scala2.12-java17-python3-ubuntu

x-spark-common: &spark-common
  image: *spark-image
  platform: linux/arm64
  user: "185:185"
  depends_on:
    init-volumes:
      condition: service_completed_successfully
  environment: &spark-env
    SPARK_NO_DAEMONIZE: "true"
    SPARK_DAEMON_MEMORY: 512m
  networks: [spark]

x-worker: &worker
  <<: *spark-common
  command: >
    /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
    spark://spark-master:7077
  depends_on:
    spark-master:
      condition: service_healthy
  deploy:
    resources:
      limits:
        cpus: "3"
        memory: 6g

x-worker-env: &worker-env
  <<: *spark-env
  SPARK_WORKER_CORES: "3"
  # Upper bound for executor heap on this worker (spark.executor.memory = 4g).
  # The remaining ~2 GB of the container limit is left for executor overhead
  # and the Worker daemon JVM.
  SPARK_WORKER_MEMORY: 4g
  SPARK_WORKER_WEBUI_PORT: "8081"
  SPARK_LOCAL_DIRS: /opt/spark-local
  SPARK_WORKER_DIR: /opt/spark-local/work

services:
  # Named volumes are created root-owned; hand them over to the spark user (185).
  init-volumes:
    image: *spark-image
    platform: linux/arm64
    user: root
    command: >
      bash -c "chown -R 185:185 /opt/spark-data /opt/spark-events
      /vol/local-master /vol/local-1 /vol/local-2 /vol/local-3"
    volumes:
      - spark-data:/opt/spark-data
      - spark-events:/opt/spark-events
      - spark-local-master:/vol/local-master
      - spark-local-1:/vol/local-1
      - spark-local-2:/vol/local-2
      - spark-local-3:/vol/local-3
    networks: [spark]

  spark-master:
    <<: *spark-common
    container_name: spark35-master
    hostname: spark-master
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/spark-master/7077"]
      interval: 3s
      timeout: 2s
      retries: 20
    environment:
      <<: *spark-env
      SPARK_LOCAL_DIRS: /opt/spark-local
      SPARK_LOCAL_HOSTNAME: spark-master
    ports:
      - "8080:8080"   # master UI
      - "4040:4040"   # driver (application) UI while a job runs
    volumes:
      - ./:/opt/project
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - spark-data:/opt/spark-data
      - spark-events:/opt/spark-events
      - spark-local-master:/opt/spark-local
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 3584m   # Master daemon (512m) + driver (2g heap) + JVM non-heap + Python

  spark-worker-1:
    <<: *worker
    container_name: spark35-worker-1
    hostname: spark-worker-1
    environment:
      <<: *worker-env
      SPARK_LOCAL_HOSTNAME: spark-worker-1
    ports: ["8081:8081"]
    volumes:
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - spark-data:/opt/spark-data
      - spark-events:/opt/spark-events
      - spark-local-1:/opt/spark-local

  spark-worker-2:
    <<: *worker
    container_name: spark35-worker-2
    hostname: spark-worker-2
    environment:
      <<: *worker-env
      SPARK_LOCAL_HOSTNAME: spark-worker-2
    ports: ["8082:8081"]
    volumes:
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - spark-data:/opt/spark-data
      - spark-events:/opt/spark-events
      - spark-local-2:/opt/spark-local

  spark-worker-3:
    <<: *worker
    container_name: spark35-worker-3
    hostname: spark-worker-3
    environment:
      <<: *worker-env
      SPARK_LOCAL_HOSTNAME: spark-worker-3
    ports: ["8083:8081"]
    volumes:
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - spark-data:/opt/spark-data
      - spark-events:/opt/spark-events
      - spark-local-3:/opt/spark-local

  spark-history:
    <<: *spark-common
    container_name: spark35-history
    hostname: spark-history
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
    environment:
      <<: *spark-env
      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=file:/opt/spark-events
        -Dspark.history.fs.update.interval=5s
        -Dspark.history.ui.port=18080
    ports:
      - "18080:18080"
    volumes:
      - spark-events:/opt/spark-events:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1g

volumes:
  spark-data:
    external: true
    name: diploma_spark-data
  spark-events:
  spark-local-master:
  spark-local-1:
  spark-local-2:
  spark-local-3:

networks:
  spark:
    name: spark35
