# Cluster-level (infrastructure) settings, identical for every run.
# Experiment parameters (AQE, shuffle partitions, broadcast threshold, CBO)
# live in jobs/spark_conf.py and are recorded with each run.

spark.master                     spark://spark-master:7077
spark.driver.host                spark-master
spark.driver.bindAddress         0.0.0.0
spark.driver.memory              2g

# One executor per worker: 3 cores, 4g heap (container limit is 6g).
spark.executor.cores             3
spark.executor.memory            4g
spark.cores.max                  9

spark.eventLog.enabled           true
spark.eventLog.dir               file:/opt/spark-events
spark.eventLog.compress          false

# Delete shuffle files of unreferenced shuffles synchronously in the cleaner
# thread (used between runs, see jobs/run_experiment.py).
spark.cleaner.referenceTracking.blocking.shuffle  true
